name: CI - Python bridge

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-python-bridge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check
        run: |
          python -m py_compile bridge/python/*.py
          echo "py_compile OK"
      - name: Ping test
        run: |
          python bridge/python/__main__.py '{"cmd":"ping"}' | grep -q '"ok":true'
          echo "ping OK"
      - name: Crypto unit test (deterministic)
        run: |
          python -c "
          from bridge.python.crypto import generate_x_client_token, generate_x_tr_signature, sorted_query_string, build_canonical_string
          assert sorted_query_string('https://api.example.com/endpoint?b=2&a=1&c=3') == 'a=1&b=2&c=3'
          assert sorted_query_string('https://api.example.com/endpoint') == ''
          tok = generate_x_client_token(1700000000000)
          assert tok.split(',')[0] == '1700000000000' and len(tok.split(',')[1]) == 32
          sig = generate_x_tr_signature('GET','application/json','application/json','https://api.example.com/path?tab=1&page=2',None,1700000000000)
          assert sig.split('|')[0] == '1700000000000' and sig.split('|')[1] == '2'
          print('crypto tests passed')
          "
      - name: Search/Details mock (no network, just import)
        run: |
          python -c "from bridge.python.models import is_trailer_title; assert is_trailer_title('Trailer-Breaking Bad'); print('models ok')"
          python -c "from bridge.python.titles import clean_moviebox_title; assert clean_moviebox_title('[Dub] Attack on Titan') == 'Attack on Titan'; print('titles ok')"

  # Optional release: no binary artifacts for python backend - just create GitHub release with source
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-python-bridge
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bridge/python/*.py
            README.md
