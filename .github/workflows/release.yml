name: Release bridge

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: OmaMovie_Linux_x64.tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: OmaMovie_Linux_arm64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build bridge
        run: cargo build --release --locked --manifest-path bridge/Cargo.toml --target "${{ matrix.target }}"
      - name: Package bridge
        run: |
          strip "bridge/target/${{ matrix.target }}/release/omamovie-bridge"
          tar -C "bridge/target/${{ matrix.target }}/release" -czf "${{ matrix.asset }}" omamovie-bridge
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OmaMovie_Linux_*.tar.gz
          merge-multiple: true
      - name: Create checksums
        run: sha256sum OmaMovie_Linux_*.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            OmaMovie_Linux_*.tar.gz
            SHA256SUMS
